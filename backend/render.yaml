services:
  - type: web
    name: memoryos-backend
    runtime: python
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port ${PORT}
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SECRET_KEY
        value: "<YOUR_SECRET_KEY>"
      - key: DATABASE_URL
        value: "<YOUR_DATABASE_URL>"
      - key: FRONTEND_URL
        value: "<YOUR_FRONTEND_URL>"
      - key: HF_TOKEN
        value: "<YOUR_HF_TOKEN>"
      - key: FROM_EMAIL
        value: "<YOUR_EMAIL>"
      - key: RENDER
        value: "true"